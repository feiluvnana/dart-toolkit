name: dart_toolkit
description: A lightweight, modular web crawling pipeline and command-line automation toolkit for Dart.
version: 0.0.3
repository: https://github.com/feiluvnana/dart-toolkit
issue_tracker: https://github.com/feiluvnana/dart-toolkit/issues
homepage: https://github.com/feiluvnana/dart-toolkit
topics:
  - web-scraping
  - crawler
  - http
  - cli
  - automation
  - concurrency

environment:
  sdk: ^3.8.0

dev_dependencies:
  path: ^1.9.0 # the reference the in-house path grammar is checked against
  yaml: ^3.1.3 # the reference the in-house YAML parser is checked against
  xml: ^7.0.1 # the reference the in-house XML parser is checked against
  html: ^0.15.7 # the reference parser the in-house one is checked against
  lints: ^6.0.0
  test: ^1.25.6
