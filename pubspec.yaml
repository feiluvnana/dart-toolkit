name: dart_toolkit
description: >-
  Scripting in Dart without the boilerplate: HTTP, HTML, JSON, files, archives
  (zip, 7z, RAR), hashes, shells, CLIs, prompts, terminal UIs and Chrome.
version: 0.0.4
repository: https://github.com/feiluvnana/dart-toolkit
topics: [cli, scripting, http, scraping, tui]
platforms:
  linux:
  macos:
  windows:

environment:
  sdk: ^3.13.0

dependencies:
  crypto: ^3.0.7
  csslib: ^1.0.2
  html: ^0.15.7
  image: ^4.12.0
  path: ^1.9.1
  puppeteer: ^3.26.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
