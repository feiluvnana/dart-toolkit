[package]
name = "dart_toolkit_chrome"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
tk_common = { path = "../common" }
# Blocking CDP websocket (ws:// only; the DevTools endpoint is always local).
tungstenite = "0.26"
serde_json = "1"
# CDP ships captures base64-encoded.
base64 = "0.22"
# `kill(pid, 0)` alive check off Windows.
libc = "0.2"
