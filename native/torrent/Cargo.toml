[package]
name = "dart_toolkit_torrent"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
tk_common = { path = "../common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# BitTorrent client sessions: trackers, DHT, PEX, magnets, uTP, LSD, UPnP, fast resume
librqbit = { version = "9", default-features = false, features = ["rust-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "io-util"] }
anyhow = "1"
