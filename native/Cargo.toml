[package]
name = "dart_toolkit_native"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# digests and MACs
md-5 = "0.10"
sha2 = { version = "0.10", features = ["asm"] }
sha1 = { version = "0.10", features = ["asm"] }
sha3 = "0.10"
blake2 = "0.10"
blake3 = "1"
ripemd = "0.1"
digest = "0.10"
hmac = "0.12"
crc32c = "0.6"
xxhash-rust = { version = "0.8", features = ["xxh64", "xxh3"] }
# archives
zip = { version = "2", default-features = false, features = ["deflate", "bzip2", "zstd", "aes-crypto", "time"] }
sevenz-rust2 = { version = "0.13", default-features = false, features = ["compress", "aes256", "bzip2", "util"] }
tar = "0.4"
flate2 = "1"
xz2 = { version = "0.1", features = ["static"] }
zstd = "0.13"
bzip2 = "0.5"
unrar = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = "0.3"
walkdir = "2"
crc32fast = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
