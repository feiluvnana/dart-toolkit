[package]
name = "dart_toolkit_native"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# digests and MACs
md-5 = "0.10"
sha2 = { version = "0.10", features = ["asm"] }
sha1 = { version = "0.10", features = ["asm"] }
sha3 = "0.10"
blake2 = "0.10"
blake3 = "1"
digest = "0.10"
hmac = "0.12"
hkdf = "0.12"
pbkdf2 = { version = "0.12", default-features = false }
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
# AEAD
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
# signatures
ed25519-dalek = { version = "2", features = ["rand_core"] }
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
rsa = { version = "0.9", features = ["sha2", "pem"] }
signature = "2"
# archives
zip = { version = "2", default-features = false, features = ["deflate", "bzip2", "zstd", "aes-crypto", "time"] }
sevenz-rust2 = { version = "0.13", default-features = false, features = ["compress", "aes256", "bzip2", "util"] }
tar = "0.4"
flate2 = "1"
xz2 = { version = "0.1", features = ["static"] }
zstd = "0.13"
bzip2 = "0.5"
unrar = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = "0.3"
walkdir = "2"
crc32fast = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
